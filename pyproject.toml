[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specvoice"
version = "0.2.0"
description = "Correctness-first speculative decoding and streaming voice-agent research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aarush Rathore" }]
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
  "torch>=2.2",
  "transformers>=4.45,<5",
  "accelerate>=0.33,<2",
]

[project.optional-dependencies]
benchmark = [
  "datasets>=2.18",
  "jiwer>=3.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
demo = [
  "gradio>=5.0,<6",
  "httpx[socks]>=0.27,<1",
]

[project.scripts]
specvoice-benchmark = "specvoice.benchmark:main"
specvoice-transcribe = "specvoice.transcribe:main"
specvoice-compare = "specvoice.compare:main"
specvoice-demo = "specvoice.demo:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
